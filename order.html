<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sketch - Pre-Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Sketch Express</h1>
        <nav>
            <ul>
                <li><a href="index.html">Menu</a></li>
                <li><a href="order.html" class="active">Pre-Order Now</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Place Your Pre-Order</h2>
            <p>Skip the line by ordering ahead. Select your time slot below.</p>
            
            <!-- HTML Form as required by syllabus -->
            <form action="#" method="get" class="order-form">
                <div class="form-group">
                    <label for="student-name">Full Name:</label>
                    <input type="text" id="student-name" name="student_name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="student-id">Student ID:</label>
                    <input type="text" id="student-id" name="student_id" placeholder="e.g. 21BDS001" required>
                </div>

                <div class="form-group">
                    <label for="item-select">Select Item:</label>
                    <select id="item-select" name="item">
                        <option value="burger">Sketch Burger - ₹80</option>
                        <option value="coffee">Cold Coffee - ₹50</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="time-slot">Pickup Time Slot (10-15 mins):</label>
                    <select id="time-slot" name="time_slot">
                        <option value="10:00-10:15">10:00 AM - 10:15 AM</option>
                        <option value="10:15-10:30">10:15 AM - 10:30 AM</option>
                        <option value="10:30-10:45">10:30 AM - 10:45 AM</option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to pay online before pickup.</label>
                </div>

                <button type="submit" class="submit-btn">Place Order</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 The Sketch Pre-Ordering System.</p>
    </footer>
</body>
</html>
